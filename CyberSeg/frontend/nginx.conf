limit_req_zone $binary_remote_addr zone=cyberseg_login:10m rate=10r/m;
# Flood and slow-connection (slowloris) resistance: bounded connections and
# request rates per client, short timeouts, small headers.
limit_req_zone $binary_remote_addr zone=cyberseg_api:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=cyberseg_conn:10m;
limit_req_status 429;
limit_conn_status 429;
client_header_timeout 10s;
client_body_timeout 10s;
send_timeout 15s;
client_header_buffer_size 2k;
large_client_header_buffers 4 8k;
reset_timedout_connection on;

# Plain HTTP only bootstraps trust: download the local CA, then go to HTTPS.
server {
  listen 80;
  server_name _;
  server_tokens off;
  limit_conn cyberseg_conn 20;
  limit_req zone=cyberseg_api burst=20 nodelay;

  location = /cyberseg-ca.crt {
    root /etc/cyberseg/public;
    types { }
    default_type application/x-x509-ca-cert;
  }

  location = /certificado {
    alias /etc/cyberseg/public/certificado.html;
    default_type "text/html; charset=utf-8";
  }

  location = /cyberseg.crl {
    root /etc/cyberseg/public;
    types { }
    default_type application/pkix-crl;
  }

  location / {
    include /etc/nginx/cyberseg-redirect.conf;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  ssl_certificate /etc/cyberseg/tls/server.crt;
  ssl_certificate_key /etc/cyberseg/tls/server.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:cyberseg:10m;

  # Docker's DNS: re-resolve the backend if its container is recreated.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $backend http://backend:8780;
  client_max_body_size 64k;
  proxy_hide_header X-Powered-By;
  limit_conn cyberseg_conn 60;
  limit_req zone=cyberseg_api burst=80 nodelay;
  proxy_connect_timeout 5s;
  proxy_read_timeout 60s;

  include /etc/nginx/security-headers.conf;

  # Every data endpoint asks the backend whether the session cookie is valid.
  location = /_auth {
    internal;
    proxy_pass $backend/api/auth/check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
  }

  location = /api/auth/login {
    limit_req zone=cyberseg_login burst=5 nodelay;
    limit_req_status 429;
    proxy_pass $backend;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /api/auth/ {
    proxy_pass $backend;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # Read-only data and downloads (alerts, statistics, blocks, findings, reports).
  location ~ ^/api/(alerts|stats|blocks|findings|engine/status|export/) {
    auth_request /_auth;
    limit_except GET { deny all; }
    proxy_pass $backend;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # Changes made from the dashboard; the backend also requires an admin
  # session and the anti-CSRF header. Engine control stays on loopback.
  location /api/manage/ {
    auth_request /_auth;
    proxy_pass $backend;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /socket.io/ {
    auth_request /_auth;
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 1h;
  }

  location /api/ {
    return 404;
  }

  # Desktop program and other files the administrator places in downloads/.
  location /descargas/ {
    auth_request /_auth;
    alias /usr/share/nginx/downloads/;
  }

  location = /cyberseg-ca.crt {
    root /etc/cyberseg/public;
    types { }
    default_type application/x-x509-ca-cert;
  }

  location = /certificado {
    alias /etc/cyberseg/public/certificado.html;
    default_type "text/html; charset=utf-8";
  }

  location = /manifest.webmanifest {
    types { }
    default_type application/manifest+json;
    try_files $uri =404;
  }

  location = /service-worker.js {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location /assets/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # The application shell carries no data: the login screen is part of it.
  location / {
    try_files $uri /index.html;
  }
}
