server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # Docker's DNS: re-resolve the backend if its container is recreated.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $backend http://backend:8780;

  # Optional basic auth, generated at start-up from CYBERSEG_DASHBOARD_USER/PASSWORD.
  include /etc/nginx/cyberseg-auth.conf;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;

  # Only the read-only endpoints the dashboard uses are proxied. Engine
  # control (start/stop/heartbeat) stays on the loopback API.
  location = /api/alerts {
    limit_except GET { deny all; }
    proxy_pass $backend;
  }

  location = /api/engine/status {
    limit_except GET { deny all; }
    proxy_pass $backend;
  }

  location = /api/stats {
    limit_except GET { deny all; }
    proxy_pass $backend;
  }

  location = /api/blocks {
    limit_except GET { deny all; }
    proxy_pass $backend;
  }

  location = /api/findings {
    limit_except GET { deny all; }
    proxy_pass $backend;
  }

  location = /health {
    proxy_pass $backend;
  }

  location /socket.io/ {
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
  }

  location / {
    try_files $uri /index.html;
  }
}
