services:
  jarvis:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jarvis
    restart: unless-stopped
    init: true
    ports:
      # Bind port 8765 to 127.0.0.1 on the host to ensure security (loopback access only)
      - "127.0.0.1:8766:8765"
    volumes:
      # Persist SQLite databases, user files, logs, and use local environment file
      - ./data:/app/data
      - ./logs:/app/logs
      - ./.env:/app/.env
    extra_hosts:
      # Allow JARVIS container to resolve 'host.docker.internal' to access host-running services (like local Ollama)
      - "host.docker.internal:host-gateway"
    environment:
      # Docker is intentionally headless. It may expose the local API for
      # integrations, while the native Windows HUD runs on the host.
      DASHBOARD_ENABLED: "true"
      # CyberSeg remains a separate, private service on the Docker host. Its
      # API token is read from .env; do not put it in this compose file.
      CYBERSEG_ENABLED: "true"
      CYBERSEG_API_URL: http://host.docker.internal:8780
      CYBERSEG_MONITOR_ENABLED: "true"
      CYBERSEG_MONITOR_POLL_SECONDS: "15"
      # The configured local Ollama service runs on the Docker host, not in
      # this container. This preserves an offline/local AI setup.
      OLLAMA_HOST: http://host.docker.internal:11434
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8765/api/status', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
